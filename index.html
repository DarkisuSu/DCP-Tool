<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>DCP Raw Profile Editor | DCP Tool</title>
    <meta name="description" content="Interactive DCP profile workspace with split preview, style delta simulation, and synchronized pan and zoom controls.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2.0.0">
</head>
<body>
    <main class="minimal-shell">
        <header class="minimal-header">
            <h1>DCP Tool — 簡化產生器</h1>
            <p>僅保留功能：三個 DCP 輸入 → 產生 offset-style DCP 並下載</p>
        </header>

        <section class="minimal-ui">
            <div class="input-row">
                <label>輸入 DCP 1 (檔案)
                    <input id="dcp-file-1" type="file" accept=".dcp" />
                </label>
                <div id="dcp-name-1" class="file-name">尚未選擇檔案</div>
            </div>

            <div class="input-row">
                <label>輸入 DCP 2 (檔案)
                    <input id="dcp-file-2" type="file" accept=".dcp" />
                </label>
                <div id="dcp-name-2" class="file-name">尚未選擇檔案</div>
            </div>

            <div class="input-row">
                <label>輸入 DCP 3 (檔案)
                    <input id="dcp-file-3" type="file" accept=".dcp" />
                </label>
                <div id="dcp-name-3" class="file-name">尚未選擇檔案</div>
            </div>

            <div class="actions">
                <button id="generate-download" class="primary">產生並下載 offset-style DCP</button>
            </div>

            <p class="note">使用說明：選擇三個 .dcp 檔案後按下按鈕，瀏覽器會在前端產生一個合併的 offset-style DCP 並觸發下載。</p>
        </section>

    </main>

    <script type="module" src="js/generate.js"></script>
</body>
</html>
