<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>DCP Offset Tool</title>
    <meta name="description" content="Generate an offset-adjusted DCP in the browser using DCP1, DCP2, and DCP3.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2.0.0">
</head>
<body>
    <main class="minimal-shell">
        <header class="minimal-header">
            <h1>DCP Offset Tool</h1>
            <p>把 DCP1 到 DCP2 的像素相關差值套用到 DCP3，直接下載新的 offset-style DCP。</p>
        </header>

        <section class="minimal-ui">
            <div class="input-row">
                <label>選擇 DCP 1（基準）
                    <input id="dcp-file-1" type="file" accept=".dcp" />
                </label>
                <div id="dcp-name-1" class="file-name">未選擇檔案</div>
            </div>

            <div class="input-row">
                <label>選擇 DCP 2（風格來源）
                    <input id="dcp-file-2" type="file" accept=".dcp" />
                </label>
                <div id="dcp-name-2" class="file-name">未選擇檔案</div>
            </div>

            <div class="input-row">
                <label>選擇 DCP 3（目標）
                    <input id="dcp-file-3" type="file" accept=".dcp" />
                </label>
                <div id="dcp-name-3" class="file-name">未選擇檔案</div>
            </div>

            <div class="actions">
                <button id="generate-download" class="primary">產生並下載 offset-style DCP</button>
            </div>

            <p class="note">會優先處理色彩矩陣、Camera Calibration、Forward Matrix、Black/White Level、Tone Curve、HueSatMap、LookTable、曝光與其他會影響畫素輸出的數值欄位；相機名稱、版權、Profile 名稱、Preview/Digest 等純資訊欄位會保留 DCP3 原值。</p>
        </section>
    </main>

    <script type="module" src="js/generate.js"></script>
</body>
</html>
